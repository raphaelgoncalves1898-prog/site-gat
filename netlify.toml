# Configuração de build do Netlify
[build]
  command = "npm install && npm run build"
  publish = "."


# Arquivos internos do projeto: nunca servir ao público.
# (publish = "." publica a pasta inteira; force = true vale mesmo com o arquivo existindo)
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/services/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/artigos"
  to = "/artigos/"
  status = 200

# Cabeçalhos de segurança aplicados a todo o site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache de longo prazo para imagens e favicons estáticos
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Painel de administração
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
