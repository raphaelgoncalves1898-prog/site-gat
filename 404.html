<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Página não encontrada | GAT</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#121212"/>
<script src="/gat-analytics.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#121212;color:#C0C0C5;font-family:'Inter',-apple-system,sans-serif;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  img{width:56px;height:56px;margin-bottom:28px}
  h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:clamp(28px,5vw,40px);color:#F5F5F7;margin-bottom:12px}
  p{font-size:16px;line-height:1.6;max-width:440px;margin:0 auto 32px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:100px;text-decoration:none;
    font-weight:600;font-size:15px;border:1px solid rgba(255,255,255,.15);color:#fff;background:#000;transition:all .3s ease}
  a.alt{background:rgba(255,255,255,.05);color:#C0C0C5}
  a:hover{transform:translateY(-2px);border-color:#C0C0C5}
</style>
</head>
<body>
<main>
  <img src="/gat-marca.png" alt="GAT"/>
  <h1>Página não encontrada</h1>

  <div class="actions">
    <a href="/">Ir para o início</a>
    <a class="alt" href="/artigos/">Ver artigos</a>
  </div>
